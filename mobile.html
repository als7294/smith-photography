<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="design_doc_mode" content="canvas"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;background:#0c0b0a}a{color:#f2efe9}a:hover{color:oklch(0.78 0.1 55)}</style></helmet>
<div style="min-height:100vh;background:#0c0b0a;color:#f2efe9;font-family:'Hanken Grotesk',sans-serif;padding:56px 48px 72px;box-sizing:border-box">
<h1 style="margin:0;font:700 40px/1.05 'Hanken Grotesk',sans-serif;letter-spacing:-.04em">Smith Photography — mobile</h1>
<p style="margin:12px 0 0;font:400 18px/1.5 'Hanken Grotesk',sans-serif;color:#a9a49b">Live site at 390×844. Each phone scrolls, and the menu and links work.</p>
<div style="display:flex;flex-wrap:wrap;gap:56px;margin-top:44px;align-items:flex-start">
<sc-for list="{{ screens }}" as="s" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;gap:18px;align-items:center">
<div style="width:414px;height:868px;padding:12px;box-sizing:border-box;border-radius:58px;background:#1d1c1a;box-shadow:inset 0 0 0 2px #34322e,0 30px 80px rgba(0,0,0,.5);position:relative">
<div style="width:390px;height:844px;border-radius:46px;overflow:hidden;background:#141312;position:relative">
<iframe src="{{ s.src }}" title="{{ s.label }}" style="width:390px;height:844px;border:0;display:block"></iframe>
<div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000"></div>
</div>
</div>
<span style="font:600 18px/1 'Hanken Grotesk',sans-serif">{{ s.label }}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const f = 'index.html';
    return {
      screens: [['home','Home'],['weddings','Weddings'],['seniors','Senior photos'],['portraits','Family & kids'],['contact','Contact']]
        .map(([p, label]) => ({ label, src: f + '?page=' + p })),
    };
  }
}
</script>
</body>
</html>
